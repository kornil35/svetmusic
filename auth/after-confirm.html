<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Email Confirmed</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/svetmusic/auth/auth.css" />
  <style>
    body {
      font-family: 'Manrope', sans-serif;
      background: #fff5f8;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
  background: white;
  padding: 24px 40px 40px 40px; /* top right bottom left */
  border-radius: 32px;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
  text-align: center;
  max-width: 400px;
  width: 100%;
}

    h2 {
      margin-bottom: 12px;
      font-size: 1.4em;
    }
    p {
      margin-bottom: 24px;
      color: #444;
    }
    a.button {
      display: inline-block;
      padding: 12px 30px;
      background: #e91e63;
      color: white;
      font-weight: 600;
      border-radius: 999px;
      text-decoration: none;
    }
    a.button:hover {
      background: #c2185b;
    }

    @keyframes popAndShake {
  0% {
    transform: scale(0);
    opacity: 0;
  }
  60% {
    transform: scale(1.1);
    opacity: 1;
  }
  80% {
    transform: scale(0.95) rotate(-2deg);
  }
  90% {
    transform: scale(1.03) rotate(2deg);
  }
  100% {
    transform: scale(1) rotate(0);
  }
}

.checkmark {
  width: 48px;
  height: 48px;
  margin-bottom: 8px; /* раньше было 16px — теперь ближе к тексту */ 
  animation: popAndShake 0.4s ease-out;
  transform-origin: center;
  display: block;
margin-left: auto;
margin-right: auto;

}


  </style>
</head>
<body>
  <div class="container">
    <svg class="checkmark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="10" fill="#4CAF50"/>
        <path d="M7 12.5L10.5 16L17 9" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      

    <h2>Email Confirmed</h2>
    <p>Your email has been successfully verified.</p>
    <a class="button" href="/svetmusic/auth/login.html">Go to Login</a>
  </div>
</body>
</html>
